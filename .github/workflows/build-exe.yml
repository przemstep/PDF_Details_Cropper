name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name PDF_Details_Cropper main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Details_Cropper-exe
          path: dist/PDF_Details_Cropper.exe
